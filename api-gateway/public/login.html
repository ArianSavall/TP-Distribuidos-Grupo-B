<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>Rentar - Iniciar Sesión</title>
    <link href="/assets/css/login.css" rel="stylesheet"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
</head>
<body class="login-body" data-page="login">
<div class="login-container"><p aria-live="polite" class="estado-pagina" hidden="" id="estado-pagina" role="status"></p>
    <div class="login-header">
        <h2>Rentar</h2>
        <p>Acceso al Sistema</p>
    </div>


    <form action="#" class="login-form" data-action="login" method="post">
        <div class="form-group">
            <label for="username">Usuario:</label>
            <input autofocus="" id="username" name="usuario" required="" type="text"/>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input autocomplete="current-password" id="password" name="password" required="" type="password"/>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>
</div>
<script defer="" src="/assets/app.js"></script>
</body>
</html>
