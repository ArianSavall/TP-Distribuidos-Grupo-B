<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Rentar - Editar Cliente</title>
<link href="/assets/css/app.css" rel="stylesheet"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/></head>
<body data-page="clientesUpdate">
<nav class="navbar">
<h2>Rentar - Admin</h2>
<div class="links">
<a data-role="ADMIN" hidden="" href="/clientes">Volver a Clientes</a>
</div>
</nav>
<div class="container"><p aria-live="polite" class="estado-pagina" hidden="" id="estado-pagina" role="status"></p>

<div class="form-card">
<h3>Modificar Cliente: <span></span></h3>
<form action="#" class="grid-form" data-action="clientesUpdate" method="post">
<div class="form-group">
<label for="clientesUpdate-campo-0">DNI:</label>
<input id="clientesUpdate-campo-0" name="dni" required="" type="text"/>
</div>
<div class="form-group">
<label for="clientesUpdate-campo-1">Nombre:</label>
<input id="clientesUpdate-campo-1" name="nombre" required="" type="text"/>
</div>
<div class="form-group">
<label for="clientesUpdate-campo-2">Apellido:</label>
<input id="clientesUpdate-campo-2" name="apellido" required="" type="text"/>
</div>
<div class="form-group">
<label for="clientesUpdate-campo-3">Email:</label>
<input id="clientesUpdate-campo-3" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="clientesUpdate-campo-4">Teléfono:</label>
<input id="clientesUpdate-campo-4" name="telefono" type="text"/>
</div>
<div class="form-group">
<label for="clientesUpdate-campo-5">Fecha de Nacimiento:</label>
<input id="clientesUpdate-campo-5" name="fechaNacimiento" type="date"/>
</div>






<div style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-top: 1rem;">
<button class="btn btn-success" type="submit">Guardar Cambios</button>
<a class="btn btn-danger" href="/clientes" style="text-decoration: none; display: flex; align-items: center;">Cancelar</a>
</div>
</form>
</div>
</div>
<script defer="" src="/assets/app.js"></script></body>
</html>
