<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rentar - Consultar Disponibilidad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <h2>Rentar</h2>
        <div class="links">
            <a th:href="@{/ui/disponibilidad}">Buscar Vehículos</a>
            <a th:href="@{/ui/mis-reservas}">Mis Reservas</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h3>Buscar Vehículos Disponibles</h3>
            <form th:action="@{/ui/disponibilidad}" method="get" class="grid-form">
                <div class="form-group">
                    <label>Fecha y Hora de Inicio (*):</label>

                    <input type="datetime-local" name="fechaInicio" required>
                </div>
                <div class="form-group">
                    <label>Fecha y Hora de Finalización (*):</label>
                    <input type="datetime-local" name="fechaFin" required>
                </div>
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
        </div>

        <h3 th:if="${disponibles != null}">Resultados de la Búsqueda</h3>
        <div class="grid-cards" th:if="${disponibles != null}">

            <div class="card" th:each="v : ${disponibles}">
                <h4 th:text="${v.marca + ' ' + v.modelo}">Toyota Corolla</h4>
                <p><strong>Tipo:</strong> <span th:text="${v.tipoVehiculo}">SEDAN</span></p>
                <p><strong>Precio Diario:</strong> $<span th:text="${v.precioDiario}">6000.0</span></p>

                <form th:action="@{/ui/reservas/alta}" method="post">
                    <input type="hidden" name="vehiculoId" th:value="${v.id}">

                    <input type="hidden" name="fechaInicio" th:value="${param.fechaInicio}">
                    <input type="hidden" name="fechaFin" th:value="${param.fechaFin}">
                    <button type="submit" class="btn btn-success">Reservar</button>
                </form>
            </div>
        </div>
        <p th:if="${disponibles != null and #lists.isEmpty(disponibles)}">No hay vehículos disponibles para las fechas seleccionadas.</p>
    </div>
</body>
</html>
