<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rentar - Editar Vehículo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <nav class="navbar">
        <h2>Rentar - Admin</h2>
        <div class="links">
            <a th:href="@{/vehiculos}">Volver a Vehículos</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h3>Modificar Vehículo: <span th:text="${vehiculo.patente}"></span></h3>
            
            <form th:action="@{/vehiculos/modificar/{patente}(patente=${vehiculo.patente})}" th:object="${vehiculo}" method="post" class="grid-form">
                
                <div class="form-group">
                    <label>Patente:</label>
                    <input type="text" th:field="*{patente}" readonly style="background-color: #e9ecef;">
                </div>
                
                <div class="form-group">
                    <label>Marca:</label>
                    <input type="text" th:field="*{marca}" required>
                </div>
                <div class="form-group">
                    <label>Modelo:</label>
                    <input type="text" th:field="*{modelo}" required>
                </div>
                <div class="form-group">
                    <label>Año:</label>
                    <input type="number" th:field="*{anio}" required>
                </div>
                <div class="form-group">
                    <label>Color:</label>
                    <input type="text" th:field="*{color}">
                </div>
                <div class="form-group">
                    <label>Tipo de Vehículo:</label>
                    <select th:field="*{tipoVehiculo}">
                        <option value="SEDAN">Sedán</option>
                        <option value="SUV">SUV</option>
                        <option value="PICKUP">Pickup</option>
                        <option value="COUPE">Coupé</option>
                        <option value="HATCHBACK">Hatchback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio Diario:</label>
                    <input type="number" step="0.01" th:field="*{precioDiario}" required>
                </div>

                <div style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-success">Guardar Cambios</button>
                    <a th:href="@{/vehiculos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
