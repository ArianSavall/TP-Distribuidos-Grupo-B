spring:
  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]
  main:
    web-application-type: none
    
  application:
    name: tp_distribuidos

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.MySQL8Dialect
  graphql:
    graphiql:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        default-requeue-rejected: false # Si falla, NO vuelve a meter el mensaje en la cola en bucle
        retry:
          enabled: true
          max-retries: 3               # Intenta hasta 3 veces
          initial-interval: 2000ms      # Espera 2 segundos entre intentos

logging:
  level:
    org:
      springframework:
        security: TRACE

grpc:
  server:
    port: 9090
  client:
    servicio-reservas:
      address: 'static://localhost:9092'
      negotiation-type: plaintext