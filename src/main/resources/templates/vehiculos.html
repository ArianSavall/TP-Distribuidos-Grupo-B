<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rentar - Gestión de Vehículos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <nav class="navbar">
        <h2>Rentar - Admin</h2>
        <div class="links">
            <a th:href="@{/vehiculos}">Vehículos</a>
            <a th:href="@{/clientes}">Clientes</a>
            <a th:href="@{/reservas}">Reservas</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h3>Registrar Nuevo Vehículo</h3>
            <form th:action="@{/vehiculos/alta}" th:object="${nuevoVehiculo}" method="post" class="grid-form">
                <div class="form-group">
                    <label>Patente (Única):</label>
                    <input type="text" th:field="*{patente}" required>
                </div>
                <div class="form-group">
                    <label>Marca:</label>
                    <input type="text" th:field="*{marca}" required>
                </div>
                <div class="form-group">
                    <label>Modelo:</label>
                    <input type="text" th:field="*{modelo}" required>
                </div>
                <div class="form-group">
                    <label>Año:</label>
                    <input type="number" th:field="*{anio}" required>
                </div>
                <div class="form-group">
                    <label>Color:</label>
                    <input type="text" th:field="*{color}">
                </div>
                <div class="form-group">
                    <label>Tipo de Vehículo:</label>
                    <select th:field="*{tipoVehiculo}">
                        <option value="SEDAN">Sedán</option>
                        <option value="SUV">SUV</option>
                        <option value="PICKUP">Pickup</option>
                        <option value="COUPE">Coupé</option>
                        <option value="HATCHBACK">Hatchback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio Diario:</label>
                    <input type="number" step="0.01" th:field="*{precioDiario}" required>
                </div>
                <button type="submit" class="btn btn-primary" style="grid-column: 1 / -1;">Registrar Vehículo</button>
            </form>
        </div>


        <div class="form-card search-card">
            <h3>Buscar Vehículo por Patente</h3>
            <form th:action="@{/vehiculos}" method="get" class="search-form">
                <div class="form-group">
                    <label>Ingrese Patente:</label>
                    <input type="text" name="patente" th:value="${patenteBuscada}" placeholder="Ej: ABC123" required>
                </div>
                <div class="search-buttons">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <a th:if="${patenteBuscada != null and !patenteBuscada.isEmpty()}" th:href="@{/vehiculos}" class="btn btn-secondary">Ver Todos</a>
                </div>
            </form>
            <p th:if="${mensajeBusqueda != null}" class="alert alert-danger" style="margin-top: 1rem;" th:text="${mensajeBusqueda}"></p>
        </div>


        <h3>Flota de Vehículos</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Patente</th>
                    <th>Marca y Modelo</th>
                    <th>Año</th>
                    <th>Tipo</th>
                    <th>Precio</th>
                    <th>Disponibilidad</th>
                    <th>Estado (Activo)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="vehiculo : ${vehiculos}">
                    <td th:text="${vehiculo.patente}"></td>
                    <td th:text="${vehiculo.marca + ' ' + vehiculo.modelo}"></td>
                    <td th:text="${vehiculo.anio}"></td>
                    <td th:text="${vehiculo.tipoVehiculo}"></td>
                    <td th:text="${'$' + vehiculo.precioDiario}"></td>
                    <td>
                        <span th:text="${vehiculo.estado}" th:class="'badge ' + ${vehiculo.estado != null ? vehiculo.estado.name().toLowerCase() : ''}"></span>
                    </td>
                    <td>
                        <span th:text="${vehiculo.estaActivo ? 'ACTIVO' : 'INACTIVO'}" th:class="'badge ' + ${vehiculo.estaActivo ? 'disponible' : 'reservado'}"></span>
                    </td>
                    <td>
                        <a th:href="@{/vehiculos/editar/{patente}(patente=${vehiculo.patente})}" class="btn btn-primary btn-sm">Editar</a>
                        
                        <!-- Botón para Activar/Desactivar dinámico[cite: 25] -->
                        <form th:action="@{/vehiculos/estado/{patente}(patente=${vehiculo.patente})}" method="post" style="display:inline;">
                            <input type="hidden" name="activar" th:value="${!vehiculo.estaActivo}">
                            <button type="submit" th:class="'btn btn-sm ' + ${vehiculo.estaActivo ? 'btn-danger' : 'btn-success'}" 
                                    th:text="${vehiculo.estaActivo ? 'Baja' : 'Alta'}"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vehiculos)}">
                    <td colspan="8" style="text-align: center; color: #777;">No se encontraron vehículos.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
