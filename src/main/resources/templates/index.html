<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Inicio | Rentar</title>
    <!-- Enlace a tu hoja de estilos unificada -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

    <main class="form-container dashboard-layout">
        
        <!-- Cabecera con Título y Logout -->
        <div class="dashboard-header">
            <h1 class="form-section-title">Panel de Control</h1>
            
            <!-- El Logout en Spring Security debe ser por POST por seguridad -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-secondary btn-inline">Cerrar Sesión</button>
            </form>
        </div>

        <p class="historial-description">Seleccioná una opción del menú para continuar.</p>

        <div class="menu-grid">
            
            <!-- BLOQUE 1: SOLO ADMINISTRADORES -->
            <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="menu-card">
                <h3 class="menu-title">Administración</h3>
                <a th:href="@{/clientes}" class="btn-primary menu-btn">Gestionar Clientes</a>
                <a th:href="@{/vehiculos}" class="btn-primary menu-btn">Gestionar Vehículos</a>
            </div>

            <!-- BLOQUE 2: ADMIN Y CLIENTE (Si está autenticado, lo ven ambos) -->
            <div sec:authorize="isAuthenticated()" class="menu-card">
                <h3 class="menu-title">Gestión de Reservas</h3>
                <a th:href="@{/reservas}" class="btn-primary menu-btn">Gestionar Reservas</a>
            </div>

            <!-- BLOQUE 3: SOLO CLIENTES -->
            <div sec:authorize="hasAuthority('ROLE_CLIENTE')" class="menu-card">
                <h3 class="menu-title">Mi Cuenta</h3>
                <a th:href="@{/historial}" class="btn-primary menu-btn">Historial de Reservas</a>
            </div>

        </div>

    </main>

</body>
</html>
