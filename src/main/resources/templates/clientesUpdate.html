<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rentar - Editar Cliente</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <nav class="navbar">
        <h2>Rentar - Admin</h2>
        <div class="links">
            <a th:href="@{/clientes}">Volver a Clientes</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h3>Modificar Cliente: <span th:text="${cliente.nombre + ' ' + cliente.apellido}"></span></h3>
            

            <form th:action="@{/clientes/modificar/{id}(id=${cliente.id})}" th:object="${cliente}" method="patch" class="grid-form">
                
                <div class="form-group">
                    <label>DNI:</label>
                    <input type="text" th:field="*{dni}" required>
                </div>
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" th:field="*{nombre}" required>
                </div>
                <div class="form-group">
                    <label>Apellido:</label>
                    <input type="text" th:field="*{apellido}" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" th:field="*{email}" required>
                </div>
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="text" th:field="*{telefono}">
                </div>
                <div class="form-group">
                    <label>Fecha de Nacimiento:</label>
                    <input type="date" th:field="*{fechaNacimiento}">
                </div>
                <div class="form-group">
                    <label>Activo:</label>
                    <input type="checkbox" th:field="*{estaActivo}">
                </div>

                <input type="hidden" th:field="*{estaActivo}">
                <input type="hidden" th:field="*{metadatos.id}" th:if="*{metadatos != null}">
                <input type="hidden" th:field="*{metadatos.password}" th:if="*{metadatos != null}">
                <input type="hidden" th:field="*{metadatos.rol}" th:if="*{metadatos != null}">
                <input type="hidden" th:field="*{metadatos.usuario}" th:if="*{metadatos != null}">

                <div style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-success">Guardar Cambios</button>
                    <a th:href="@{/clientes}" class="btn btn-danger" style="text-decoration: none; display: flex; align-items: center;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
